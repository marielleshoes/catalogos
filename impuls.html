<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Catálogo Impuls</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      background-color: #333;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header select {
      padding: 6px;
      font-size: 16px;
    }

    .viewer-container {
      width: 100vw;
      height: calc(100vh - 60px);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .viewer {
      display: flex;
      transition: transform 0.3s ease;
      transform-origin: center center;
    }

    .page {
      max-height: 100%;
      max-width: 50vw;
      object-fit: contain;
    }

    .controls {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .controls button {
      padding: 8px 14px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h2>Catálogo Impuls tratando</h2>
  <div>
    <label for="categoria">Categoría: </label>
    <select id="categoria" onchange="cambiarCategoria(this.value)">
      <option value="dama">Dama</option>
      <option value="caballero">Caballero</option>
      <option value="nina">Niña</option>
      <option value="nino">Niño</option>
    </select>
  </div>
</header>

<div class="viewer-container">
  <div class="viewer" id="viewer"></div>
</div>

<div class="controls">
  <button onclick="paginaAnterior()">← Anterior</button>
  <button onclick="zoomOut()">Zoom -</button>
  <button onclick="zoomIn()">Zoom +</button>
  <button onclick="paginaSiguiente()">Siguiente →</button>
</div>

<script>
  const totalPaginasPorCategoria = {
    dama: 384,
    caballero: 122,
    nina: 118,
    nino: 100
  };

  let categoriaActual = 'dama';
  let paginaActual = 1;
  let escala = 1;

  const viewer = document.getElementById("viewer");

  function pad(num) {
    return num.toString().padStart(4, '0');
  }

  function capitalizar(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function limpiarViewer() {
    viewer.innerHTML = "";
  }

  function cargarPaginas() {
    limpiarViewer();

    const carpeta = `pdfs/impuls_${categoriaActual}`;
    const prefijo = `MC_Impuls ${capitalizar(categoriaActual)}_page-`;
    const total = totalPaginasPorCategoria[categoriaActual];

    const img1 = document.createElement("img");
    img1.className = "page";
    img1.src = `${carpeta}/${prefijo}${pad(paginaActual)}.webp`;
    img1.alt = `Página ${paginaActual}`;
    viewer.appendChild(img1);

    if (paginaActual + 1 <= total) {
      const img2 = document.createElement("img");
      img2.className = "page";
      img2.src = `${carpeta}/${prefijo}${pad(paginaActual + 1)}.webp`;
      img2.alt = `Página ${paginaActual + 1}`;
      viewer.appendChild(img2);
    }

    ajustarZoom();
  }

  function ajustarZoom() {
    viewer.style.transform = `scale(${escala})`;
  }

  function zoomIn() {
    escala += 0.1;
    ajustarZoom();
  }

  function zoomOut() {
    escala = Math.max(0.1, escala - 0.1);
    ajustarZoom();
  }

  function paginaSiguiente() {
    const total = totalPaginasPorCategoria[categoriaActual];
    if (paginaActual + 2 <= total) {
      paginaActual += 2;
      cargarPaginas();
    }
  }

  function paginaAnterior() {
    if (paginaActual - 2 >= 1) {
      paginaActual -= 2;
      cargarPaginas();
    }
  }

  function cambiarCategoria(cat) {
    categoriaActual = cat;
    paginaActual = 1;
    escala = 1;
    cargarPaginas();
  }

  window.addEventListener("load", cargarPaginas);
  window.addEventListener("resize", () => {
    ajustarZoom();
  });
</script>

</body>
</html>
