<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Impuls - Dama</title>
  <style>
    body {
      font-family: sans-serif;
      background: #eee;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .flipbook-container {
      width: 90vw;
      height: 90vh;
      margin: auto;
      overflow: hidden;
    }

    #catalogo {
      width: 100%;
      height: 100%;
    }

    .whatsapp-btn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 18px;
      background-color: #25D366;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Catálogo Impuls - Dama rendid</h2>

  <div class="flipbook-container" id="catalogo"></div>

  <a href="https://wa.me/521XXXXXXXXXX?text=Hola%2C%20quiero%20hacer%20un%20pedido%20de%20Impuls%20Dama" target="_blank">
    <button class="whatsapp-btn">Contactar por WhatsApp</button>
  </a>

  <!-- Librería FlipbookJS -->
  <script src="https://unpkg.com/page-flip/dist/page-flip.browser.min.js"></script>

  <script>
    const catalogo = document.getElementById("catalogo");

    const pageFlip = new St.PageFlip(catalogo, {
      width: 600,
      height: 800,
      size: "stretch",
      maxShadowOpacity: 0.5,
      showCover: false,
      mobileScrollSupport: false
    });

    const totalPages = 20; // cambia este número a la cantidad de páginas que tengas

    const getFilename = (num) => {
      const padded = num.toString().padStart(4, '0');
      return `pdfs/impuls_dama/MC_Impuls Dama_page-${padded}.webp`;
    };

    const imagePaths = [];
    for (let i = 1; i <= totalPages; i++) {
      imagePaths.push(getFilename(i));
    }

    pageFlip.loadFromImages(imagePaths);
  </script>
</body>
</html>
