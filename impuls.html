<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo con Zoom y Flip</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #catalogo {
      width: 90vw;
      height: 90vh;
      position: relative;
    }

    .flipbook {
      width: 100%;
      height: 100%;
      display: flex;
      perspective: 2000px;
      overflow: hidden;
      position: relative;
    }

    .page {
      width: 50%;
      height: 100%;
      background: white;
      position: absolute;
      top: 0;
      transition: transform 1s;
      transform-origin: left center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .page.right {
      left: 50%;
      transform-origin: right center;
    }

    .page-content {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    .zoom-wrapper {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    button {
      margin: 0 10px;
      padding: 10px 20px;
      border: none;
      background: #444;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
    }

    button:hover {
      background: #666;
    }
  </style>
</head>
<body>

<div id="catalogo">
  <div class="flipbook" id="flipbook">
    <!-- Las páginas se insertan aquí -->
  </div>
  <div id="controls">
    <button onclick="prevPage()">Anterior</button>
    <button onclick="nextPage()">Siguiente</button>
    <button onclick="resetZoom()">Resetear Zoom</button>
  </div>
</div>

<!-- Librerías -->
<script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@9.4.0/dist/panzoom.min.js"></script>

<script>
  const flipbook = document.getElementById('flipbook');
  const imageSources = [
    'https://via.placeholder.com/800x1000?text=Página+1',
    'https://via.placeholder.com/800x1000?text=Página+2',
    'https://via.placeholder.com/800x1000?text=Página+3',
    'https://via.placeholder.com/800x1000?text=Página+4'
  ];

  let currentPage = 0;
  const pages = [];

  function createPageImage(src, side = 'left') {
    const page = document.createElement('div');
    page.className = 'page ' + (side === 'right' ? 'right' : '');

    const pageContent = document.createElement('div');
    pageContent.className = 'page-content';

    const zoomWrapper = document.createElement('div');
    zoomWrapper.className = 'zoom-wrapper';

    const img = document.createElement('img');
    img.src = src;

    zoomWrapper.appendChild(img);
    pageContent.appendChild(zoomWrapper);
    page.appendChild(pageContent);
    flipbook.appendChild(page);

    // Aplicar panzoom después de insertar
    const zoomInstance = panzoom(zoomWrapper, {
      maxZoom: 3,
      minZoom: 1,
      bounds: true,
      boundsPadding: 0.1
    });

    // Guardar la instancia para reset
    page._zoom = zoomInstance;

    return page;
  }

  function loadPages() {
    for (let i = 0; i < imageSources.length; i += 2) {
      const leftPage = createPageImage(imageSources[i], 'left');
      pages.push(leftPage);
      if (imageSources[i + 1]) {
        const rightPage = createPageImage(imageSources[i + 1], 'right');
        pages.push(rightPage);
      }
    }
    updatePages();
  }

  function updatePages() {
    pages.forEach((page, index) => {
      if (index === currentPage || index === currentPage + 1) {
        page.style.zIndex = 2;
        page.style.transform = 'rotateY(0deg)';
      } else if (index < currentPage) {
        page.style.zIndex = 1;
        page.style.transform = 'rotateY(-180deg)';
      } else {
        page.style.zIndex = 0;
        page.style.transform = 'rotateY(0deg)';
      }
    });
  }

  function nextPage() {
    if (currentPage + 2 < pages.length) {
      currentPage += 2;
      updatePages();
    }
  }

  function prevPage() {
    if (currentPage - 2 >= 0) {
      currentPage -= 2;
      updatePages();
    }
  }

  function resetZoom() {
    pages.forEach(page => {
      if (page._zoom) {
        page._zoom.zoomAbs(0, 0, 1); // zoom al 100%
        page._zoom.moveTo(0, 0);     // reposicionar al centro
      }
    });
  }

  loadPages();
</script>

</body>
</html>
