<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Impuls</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      margin-top: 1rem;
    }

    .controls {
      margin: 1rem 0;
    }

    .controls button {
      padding: 0.5rem 1rem;
      margin: 0 0.25rem;
      font-size: 1rem;
      border: none;
      background-color: #333;
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }

    .controls button:hover {
      background-color: #555;
    }

    #flipbook {
      margin: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      background: white;
    }

    .page {
      width: 100%;
      height: 100%;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      touch-action: none;
    }
  </style>

  <!-- Turn.js -->
  <script src="https://cdn.jsdelivr.net/npm/turn.js@4/turn.min.js"></script>

  <!-- Panzoom -->
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@9.4.0/dist/panzoom.min.js"></script>
</head>
<body>

  <h1>Catálogo Impuls zoom sol 3</h1>

  <div class="controls">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div class="controls">
    <button onclick="$('#flipbook').turn('page', 1)">Primera</button>
    <button onclick="$('#flipbook').turn('previous')">⏪ Anterior</button>
    <button onclick="$('#flipbook').turn('next')">⏩ Siguiente</button>
    <button onclick="$('#flipbook').turn('page', $('#flipbook').turn('pages'))">Última</button>
  </div>

  <div class="controls">
    <button id="zoom-in">🔍 Acercar</button>
    <button id="zoom-out">🔎 Alejar</button>
    <button id="reset-zoom">♻️ Restablecer</button>
  </div>

  <div id="flipbook"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    const totalPaginas = {
      dama: 384,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let panzoomInstance = null;
    let categoriaActual = 'dama';

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function calcularDimensiones() {
      const anchoVentana = window.innerWidth;
      const altoVentana = window.innerHeight;

      if (anchoVentana < 768) {
        return { width: anchoVentana * 0.9, height: altoVentana * 0.7, display: 'single' };
      } else {
        return { width: 800, height: 500, display: 'double' };
      }
    }

    function habilitarZoomEnPagina(pagina) {
      if (panzoomInstance) {
        panzoomInstance.destroy();
      }

      const img = $(pagina).find("img")[0];
      if (img) {
        panzoomInstance = Panzoom(img, {
          maxScale: 3,
          minScale: 1,
          contain: "outside",
          startScale: 1
        });

        img.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);
      }
    }

    function cargarCategoria(categoria) {
      categoriaActual = categoria;
      const total = totalPaginas[categoria];
      const $flipbook = $('#flipbook');
      $flipbook.html('');

      for (let i = 1; i <= total; i++) {
        const padded = i.toString().padStart(4, '0');
        const url = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-${padded}.webp`;
        $flipbook.append(`<div class="page"><img src="${url}" alt="Página ${i}"></div>`);
      }

      if ($flipbook.data('turn')) {
        $flipbook.turn('destroy').removeClass('turnjs');
      }

      const { width, height, display } = calcularDimensiones();

      $flipbook.css({ width: `${width}px`, height: `${height}px` });

      $flipbook.turn({
        width: width,
        height: height,
        autoCenter: true,
        display: display,
        elevation: 50,
        gradients: true,
        when: {
          turned: function (e, page) {
            const currentPage = $(this).find('.page').eq(page - 1);
            habilitarZoomEnPagina(currentPage);
          }
        }
      });

      // Habilitamos zoom en la primera página
      habilitarZoomEnPagina($flipbook.find('.page').eq(0));
    }

    $(document).ready(() => {
      cargarCategoria('dama');

      window.addEventListener('resize', () => {
        cargarCategoria(categoriaActual);
      });

      $('#zoom-in').on('click', () => {
        if (panzoomInstance) panzoomInstance.zoomIn();
      });

      $('#zoom-out').on('click', () => {
        if (panzoomInstance) panzoomInstance.zoomOut();
      });

      $('#reset-zoom').on('click', () => {
        if (panzoomInstance) panzoomInstance.reset();
      });
    });
  </script>
</body>
</html>
