<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Impuls</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .viewer {
      position: relative;
      display: inline-block;
      margin-top: 20px;
      max-width: 90vw;
    }

    #catalogImage {
      max-width: 100%;
      max-height: 80vh;
      transition: transform 0.3s ease;
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      margin: 0 10px;
      padding: 8px 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>Catálogo Impuls reinicio</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div class="viewer">
    <img id="catalogImage" src="" alt="Catálogo Impuls">
  </div>

  <div class="controls">
    <button onclick="paginaAnterior()">⏪ Anterior</button>
    <button onclick="zoomIn()">🔍 Acercar</button>
    <button onclick="zoomOut()">🔍 Alejar</button>
    <button onclick="paginaSiguiente()">⏩ Siguiente</button>
  </div>

  <script>
    let categoria = 'dama';
    let pagina = 1;
    const totalPaginas = {
      dama: 20,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let zoom = 1;

    function actualizarImagen() {
      const padded = pagina.toString().padStart(4, '0');
      const ruta = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-${padded}.webp`;
      document.getElementById('catalogImage').src = ruta;
      document.getElementById('catalogImage').style.transform = `scale(${zoom})`;
    }

    function cargarCategoria(cat) {
      categoria = cat;
      pagina = 1;
      zoom = 1;
      actualizarImagen();
    }

    function paginaSiguiente() {
      if (pagina < totalPaginas[categoria]) {
        pagina++;
        actualizarImagen();
      }
    }

    function paginaAnterior() {
      if (pagina > 1) {
        pagina--;
        actualizarImagen();
      }
    }

    function zoomIn() {
      zoom += 0.1;
      actualizarImagen();
    }

    function zoomOut() {
      if (zoom > 0.2) {
        zoom -= 0.1;
        actualizarImagen();
      }
    }

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    // Cargar la primera imagen al abrir la página
    window.onload = () => {
      actualizarImagen();
    };
  </script>
</body>
</html>
