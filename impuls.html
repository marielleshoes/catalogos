<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Catálogo Impuls</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .flipbook-container {
      width: 95vw;
      height: 80vh;
      margin: auto;
      background: white;
      border: 2px solid #ccc;
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      margin: 0 10px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    /* Loading message */
    .loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }
  </style>
  <!-- Incluye la biblioteca StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/page-flip.browser.min.js"></script>
</head>
<body>

  <h1>Catálogo Impuls raro</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div class="flipbook-container" id="flipbook"></div>

  <div class="controls">
    <button onclick="irAPrimeraPagina()">Primera</button>
    <button onclick="paginaAnterior()">⏪ Anterior</button>
    <button onclick="paginaSiguiente()">⏩ Siguiente</button>
    <button onclick="irAUltimaPagina()">Última</button>
  </div>

  <script>
    let categoria = 'dama';
    const totalPaginas = {
      dama: 384,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let pageFlip;

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function cargarCategoria(cat) {
      categoria = cat;
      if (pageFlip) {
        pageFlip.destroy();
      }
      inicializarFlipbook();
    }

function inicializarFlipbook() {
  const flipbookElement = document.getElementById('flipbook');
  pageFlip = new PageFlip(flipbookElement, {
    width: flipbookElement.clientWidth / 2,
    height: flipbookElement.clientHeight,
    size: 'stretch',
    minWidth: 315,
    maxWidth: 1000,
    minHeight: 420,
    maxHeight: 1350,
    maxShadowOpacity: 0.5,
    showCover: false,
    mobileScrollSupport: false
  });

  const pages = [];
  for (let i = 1; i <= totalPaginas[categoria]; i++) {
    const padded = i.toString().padStart(4, '0');
    const base = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-${padded}.webp`;
    pages.push({ src: base });
  }

  pageFlip.loadFromImages(pages.map(p => p.src));
}


    function paginaSiguiente() {
      pageFlip.flipNext();
    }

    function paginaAnterior() {
      pageFlip.flipPrev();
    }

    function irAPrimeraPagina() {
      pageFlip.flip(0);
    }

    function irAUltimaPagina() {
      pageFlip.flip(totalPaginas[categoria] - 1);
    }

    window.onload = () => {
      inicializarFlipbook();
    };
  </script>

</body>
</html>
