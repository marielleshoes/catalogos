<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Impuls cagada</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
    }

    .viewer {
      width: 100vw;
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      background: white;
      border: 2px solid #ccc;
    }

    .image-container {
      display: flex;
      transition: transform 0.3s ease;
      transform-origin: center center;
      cursor: grab;
    }

    .image-container img {
      max-height: 100%;
      height: auto;
      width: auto;
      object-fit: contain;
    }

    .controls {
      text-align: center;
      margin-top: 10px;
    }

    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="viewer" id="viewer">
    <div class="image-container" id="imageContainer"></div>
  </div>

  <div class="controls">
    <button onclick="prevPage()">⬅ Página anterior</button>
    <button onclick="nextPage()">Página siguiente ➡</button>
    <button onclick="zoomIn()">Zoom +</button>
    <button onclick="zoomOut()">Zoom -</button>
    <button onclick="resetZoom()">Reset Zoom</button>
  </div>

  <script>
    const imageContainer = document.getElementById("imageContainer");
    const viewer = document.getElementById("viewer");

    const totalPages = 20; // Cambia este número según cuántas páginas tenga tu categoría
    const folder = "pdfs/impuls_dama/";
    const prefix = "MC_Impuls Dama_page-";
    const suffix = ".webp";
    let currentPage = 1;
    let scale = 1;
    let originX = 0, originY = 0;
    let lastX = 0, lastY = 0;
    let isDragging = false, startX, startY;

    function pad(num) {
      return num.toString().padStart(4, '0');
    }

    function loadPages() {
      imageContainer.innerHTML = "";
      const img1 = document.createElement("img");
      img1.src = `${folder}${prefix}${pad(currentPage)}${suffix}`;
      img1.alt = `Página ${currentPage}`;
      imageContainer.appendChild(img1);

      if (currentPage + 1 <= totalPages) {
        const img2 = document.createElement("img");
        img2.src = `${folder}${prefix}${pad(currentPage + 1)}${suffix}`;
        img2.alt = `Página ${currentPage + 1}`;
        imageContainer.appendChild(img2);
      }
      resetZoom(false); // solo resetea zoom sin reiniciar la página
    }

    function nextPage() {
      if (currentPage + 2 <= totalPages) {
        currentPage += 2;
        loadPages();
      }
    }

    function prevPage() {
      if (currentPage - 2 >= 1) {
        currentPage -= 2;
        loadPages();
      }
    }

    function applyTransform() {
      imageContainer.style.transform = `scale(${scale}) translate(${originX}px, ${originY}px)`;
    }

    function zoomIn() {
      scale = Math.min(scale + 0.2, 3);
      applyTransform();
    }

    function zoomOut() {
      scale = Math.max(scale - 0.2, 1);
      applyTransform();
    }

    function resetZoom(resetPos = true) {
      scale = 1;
      if (resetPos) {
        currentPage = 1;
        loadPages();
      } else {
        originX = 0;
        originY = 0;
        lastX = 0;
        lastY = 0;
        applyTransform();
      }
    }

    // Pan - arrastrar imágenes cuando hay zoom
    viewer.addEventListener("mousedown", (e) => {
      if (scale === 1) return;
      isDragging = true;
      startX = e.clientX - lastX;
      startY = e.clientY - lastY;
      viewer.style.cursor = "grabbing";
    });

    viewer.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      lastX = e.clientX - startX;
      lastY = e.clientY - startY;
      originX = lastX;
      originY = lastY;
      applyTransform();
    });

    viewer.addEventListener("mouseup", () => {
      isDragging = false;
      viewer.style.cursor = "grab";
    });

    viewer.addEventListener("mouseleave", () => {
      isDragging = false;
      viewer.style.cursor = "grab";
    });

    loadPages();
  </script>

</body>
</html>
