<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Catálogo Impuls</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .viewer-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 80vh;
      overflow: hidden;
    }

.viewer {
  position: relative;
  display: flex;
  border: 2px solid #ccc;
  background: white;
  width: 95vw;
  height: 80vh;
  overflow: auto;
  margin: auto;
  touch-action: pan-x pan-y;
}


    .image-container {
      display: flex;
      transform-origin: top left;
      transition: transform 0.2s ease;
    }

    .image-container img {
      max-width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      margin: 0 10px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    /* En móvil */
    @media (max-width: 768px) {
      .image-container {
        flex-direction: column;
        align-items: center;
      }
    
      .image-container img:nth-child(2) {
        display: none;
      }
    
      .viewer {
        height: auto; /* Ajustar al contenido */
        max-height: none; /* Eliminar límite de altura */
        overflow-y: auto; /* Permitir scroll si se necesita */
      }
    
      .viewer-wrapper {
        max-height: none;
      }
    }
    @media (min-width: 769px) {
      .image-container {
        justify-content: center;
        width: 100%;
      }
    }
.loader {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.2rem;
  z-index: 10;
}


  </style>
</head>
<body>

  <h1>Catálogo Impuls carga sol view</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

<div class="viewer-wrapper">
  <div id="viewer" class="viewer">
    <div id="loader" class="loader">Cargando imágenes...</div>
    <div id="imageContainer" class="image-container">
      <img id="page1" src="" alt="Página izquierda">
      <img id="page2" src="" alt="Página derecha">
    </div>
  </div>
</div>


  <div class="controls">
    <button onclick="paginaAnterior()">⏪ Anterior</button>
    <button onclick="zoomIn()">🔍 Acercar</button>
    <button onclick="zoomOut()">🔍 Alejar</button>
    <button onclick="paginaSiguiente()">⏩ Siguiente</button>
  </div>

  <script>
    let categoria = 'dama';
    let pagina = 1;
    const totalPaginas = {
      dama: 20,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let zoom = 1;

    function esMovil() {
      return window.innerWidth <= 768;
    }

function actualizarImagenes() {
  const loader = document.getElementById('loader');
  loader.style.display = 'flex';

  const padded1 = pagina.toString().padStart(4, '0');
  const padded2 = (pagina + 1).toString().padStart(4, '0');
  const base = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-`;

  const img1 = document.getElementById('page1');
  const img2 = document.getElementById('page2');

  img1.onload = () => {
    if (esMovil()) {
      loader.style.display = 'none';
    }
  };

  img2.onload = () => {
    loader.style.display = 'none';
  };

  img1.src = `${base}${padded1}.webp`;

  if (!esMovil()) {
    img2.style.display = 'inline';
    img2.src = `${base}${padded2}.webp`;
  } else {
    img2.style.display = 'none';
  }

  document.getElementById('imageContainer').style.transform = `scale(${zoom})`;
}


    function cargarCategoria(cat) {
      categoria = cat;
      pagina = 1;
      zoom = 1;
      document.getElementById('viewer').scrollLeft = 0;
      document.getElementById('viewer').scrollTop = 0;
      actualizarImagenes();
    }

    function paginaSiguiente() {
      const incremento = esMovil() ? 1 : 2;
      if (pagina + incremento <= totalPaginas[categoria]) {
        pagina += incremento;
        actualizarImagenes();
      }
    }

    function paginaAnterior() {
      const decremento = esMovil() ? 1 : 2;
      if (pagina - decremento >= 1) {
        pagina -= decremento;
        actualizarImagenes();
      }
    }

    function zoomIn() {
      zoom += 0.1;
      actualizarImagenes();
    }

    function zoomOut() {
      if (zoom > 0.2) {
        zoom -= 0.1;
        actualizarImagenes();
      }
    }

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    window.onload = () => {
      actualizarImagenes();
    };

    window.onresize = () => {
      actualizarImagenes();
    };
  </script>

</body>
</html>
