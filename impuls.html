<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Impuls</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/blasten/turn.js@4/turn.min.js"></script>
  <style>
    body {
      background: #f5f5f5;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 20px;
    }

    select {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }

    #flipbook {
      width: 800px;
      height: 1056px;
      margin-top: 30px;
    }

    #flipbook .page {
      width: 100%;
      height: 100%;
    }

    .whatsapp-btn {
      margin-top: 20px;
      padding: 12px 20px;
      background: #25D366;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>Catálogo Impuls flip</h1>

  <label for="categoria">Selecciona una categoría:</label>
  <select id="categoria">
    <option value="dama">Dama</option>
    <option value="caballero">Caballero</option>
    <option value="niño">Niño</option>
    <option value="niña">Niña</option>
  </select>

  <div id="flipbook">
    <!-- Se insertan las páginas dinámicamente -->
  </div>

  <a id="whatsapp-link" class="whatsapp-btn" href="#" target="_blank">
    Realizar pedido por WhatsApp
  </a>

  <script>
    const totalPagesPorCategoria = {
      dama: 20,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    const carpetaPorCategoria = {
      dama: "impuls_dama",
      caballero: "impuls_caballero",
      niño: "impuls_niño",
      niña: "impuls_niña"
    };

    function cargarCatalogo(categoria) {
      const totalPages = totalPagesPorCategoria[categoria];
      const carpeta = carpetaPorCategoria[categoria];
      const flipbook = $("#flipbook");

      // Limpia el flipbook actual
      flipbook.html("");

      // Destruye el flipbook anterior si existe
      if (flipbook.data("turn")) {
        flipbook.turn("destroy").removeClass("turnjs");
      }

      // Inserta nuevas páginas
      for (let i = 1; i <= totalPages; i++) {
        const padded = i.toString().padStart(4, '0');
        const imgPath = `pdfs/${carpeta}/MC_Impuls ${capitalize(categoria)}_page-${padded}.webp`;
        flipbook.append(`<div class="page"><img src="${imgPath}" style="width:100%; height:100%;" /></div>`);
      }

      // Inicializa el nuevo flipbook
      flipbook.turn({
        width: 800,
        height: 1056,
        autoCenter: true
      });

      // Actualiza el link de WhatsApp
      const mensaje = encodeURIComponent(`Hola, quiero hacer un pedido del catálogo Impuls - ${capitalize(categoria)}.`);
      $("#whatsapp-link").attr("href", `https://wa.me/5211234567890?text=${mensaje}`);
    }

    function capitalize(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    $(document).ready(function () {
      const selector = $("#categoria");

      // Cargar la primera categoría por defecto
      cargarCatalogo(selector.val());

      // Al cambiar la categoría
      selector.on("change", function () {
        const categoria = $(this).val();
        cargarCatalogo(categoria);
      });
    });
  </script>

</body>
</html>
