<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Impuls - Dama</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.css" />
  <style>
    #flipbook {
      width: 800px;
      height: 1000px;
      margin: auto;
    }
    #flipbook .page {
      width: 100%;
      height: 100%;
    }
    .zoom-container {
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body>

  <h1 style="text-align:center;">Catálogo Impuls - Dama ya arta</h1>
  <div class="zoom-container">
    <div id="flipbook">
      <!-- Las páginas se agregarán aquí -->
    </div>
  </div>

  <div style="text-align:center; margin-top:20px;">
    <button onclick="zoomIn()">Acercar</button>
    <button onclick="zoomOut()">Alejar</button>
    <a href="https://wa.me/521XXXXXXXXXX?text=Hola%20quiero%20hacer%20un%20pedido%20de%20Impuls%20Dama" target="_blank">
      <button>Contactar por WhatsApp</button>
    </a>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>

  <script>
    const totalPages = 384; // Cambia este número según cuántas páginas tengas
    const flipbook = $("#flipbook");

    for (let i = 1; i <= totalPages; i++) {
      const pageNum = i.toString().padStart(4, '0'); // 0001
      const imgPath = `pdfs/impuls_dama/MC_Impuls Dama_page-${pageNum}.webp`;
      flipbook.append(`<div class="page"><img src="${imgPath}" style="width:100%; height:100%;" /></div>`);
    }

    flipbook.turn({
      width: 800,
      height: 1000,
      autoCenter: true
    });

    const panzoom = Panzoom(document.querySelector("#flipbook"), {
      maxScale: 2,
      minScale: 1,
      contain: 'outside'
    });

    function zoomIn() {
      panzoom.zoomIn();
    }

    function zoomOut() {
      panzoom.zoomOut();
    }
  </script>
</body>
</html>
