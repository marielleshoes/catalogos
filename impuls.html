<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Catálogo Impuls</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .flipbook {
      width: 95vw;
      height: 80vh;
      margin: auto;
    }

    .flipbook .page {
      width: 100%;
      height: 100%;
    }

    .flipbook .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      margin: 0 10px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    /* Loading message */
    .loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .flipbook {
        width: 100vw;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <h1>Catálogo Impuls otra vez turns</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div id="loading" class="loading" style="display: none;">Cargando...</div>

  <div id="flipbook" class="flipbook">
    <!-- Las páginas se cargarán dinámicamente aquí -->
  </div>

  <div class="controls">
    <button onclick="irAPrimeraPagina()">Primera</button>
    <button onclick="paginaAnterior()">⏪ Anterior</button>
    <button onclick="zoomIn()">🔍 Acercar</button>
    <button onclick="zoomOut()">🔍 Alejar</button>
    <button onclick="paginaSiguiente()">⏩ Siguiente</button>
    <button onclick="irAUltimaPagina()">Última</button>
  </div>

  <!-- Incluir jQuery y Turn.js -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://www.turnjs.com/lib/turn.min.js"></script>

  <script>
    let categoria = 'dama';
    let pagina = 1;
    const totalPaginas = {
      dama: 384,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let zoom = 1;
    const zoomMinimo = 1;
    const zoomMaximo = 3;

    function esMovil() {
      return window.innerWidth <= 768;
    }

    function mostrarCargando(mostrar) {
      document.getElementById('loading').style.display = mostrar ? 'flex' : 'none';
    }

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function cargarCategoria(cat) {
      categoria = cat;
      pagina = 1;
      zoom = 1;
      cargarPaginas();
    }

    function cargarPaginas() {
      mostrarCargando(true);
      const flipbook = $('#flipbook');
      flipbook.html('');
      const base = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-`;
      const total = totalPaginas[categoria];
      const incremento = esMovil() ? 1 : 2;

      for (let i = 1; i <= total; i += incremento) {
        const padded = i.toString().padStart(4, '0');
        const img = `${base}${padded}.webp`;
        flipbook.append(`<div class="page"><img src="${img}" alt="Página ${i}"></div>`);
      }

      flipbook.turn({
        width: flipbook.width(),
        height: flipbook.height(),
        autoCenter: true,
        display: esMovil() ? 'single' : 'double'
      });

      mostrarCargando(false);
    }

    function paginaSiguiente() {
      $('#flipbook').turn('next');
    }

    function paginaAnterior() {
      $('#flipbook').turn('previous');
    }

    function irAPrimeraPagina() {
      $('#flipbook').turn('page', 1);
    }

    function irAUltimaPagina() {
      const total = $('#flipbook').turn('pages');
      $('#flipbook').turn('page', total);
    }

    function zoomIn() {
      if (zoom < zoomMaximo) {
        zoom += 0.1;
        aplicarZoom();
      }
    }

    function zoomOut() {
      if (zoom > zoomMinimo) {
        zoom -= 0.1;
        aplicarZoom();
      }
    }

    function aplicarZoom() {
      $('#flipbook').css('transform', `scale(${zoom})`);
    }

    $(document).ready(function() {
      cargarPaginas();
    });

    $(window).on('resize', function() {
      cargarPaginas();
    });
  </script>

</body>
</html>
