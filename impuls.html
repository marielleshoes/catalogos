<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0" />
  <title>Catálogo Impuls</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
      background: #f4f4f4;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }

    #flipbook-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y pinch-zoom;
    }

    #flipbook {
      width: 100%;
      max-width: 800px;
      height: auto;
      margin: auto;
      touch-action: manipulation;
    }

    .page img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      touch-action: none;
      -webkit-user-drag: none;
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      margin: 0 10px;
      padding: 8px 16px;
      font-size: 16px;
    }
  </style>

  <!-- jQuery y Turn.js -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
</head>
<body>

  <h1>Catálogo Impuls sol 1</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div id="flipbook-container">
    <div id="flipbook"></div>
  </div>

  <div class="controls">
    <button onclick="$('#flipbook').turn('page', 1)">Primera</button>
    <button onclick="$('#flipbook').turn('previous')">⏪ Anterior</button>
    <button onclick="$('#flipbook').turn('next')">⏩ Siguiente</button>
    <button onclick="$('#flipbook').turn('page', $('#flipbook').turn('pages'))">Última</button>
  </div>

  <script>
    const totalPaginas = {
      dama: 384,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let categoriaActual = 'dama';

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function cargarCategoria(categoria) {
      categoriaActual = categoria;
      const total = totalPaginas[categoria];
      const $flipbook = $('#flipbook');
      $flipbook.html('');

      for (let i = 1; i <= total; i++) {
        const padded = i.toString().padStart(4, '0');
        const url = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-${padded}.webp`;
        $flipbook.append(`<div class="page"><img src="${url}" alt="Página ${i}"></div>`);
      }

      if ($flipbook.data('turn')) {
        $flipbook.turn('destroy');
      }

      const isMobile = window.innerWidth < 768;

      // Turn.js solo se activa en pantallas grandes
      if (!isMobile) {
        $flipbook.turn({
          width: 800,
          height: 500,
          autoCenter: true,
          display: 'double'
        });
      }
    }

    $(document).ready(() => {
      cargarCategoria('dama');
    });
  </script>

</body>
</html>
