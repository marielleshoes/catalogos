<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Catálogo Impuls</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }

    #flipbook-container {
      width: 100%;
      max-width: 100vw;
      overflow: hidden;
      margin: auto;
    }

    #flipbook {
      margin: auto;
    }

    .page img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      margin: 0 10px;
      padding: 8px 16px;
      font-size: 16px;
    }
  </style>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
</head>
<body>

  <h1>Catálogo Impuls sol 2</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div id="flipbook-container">
    <div id="flipbook"></div>
  </div>

  <div class="controls">
    <button onclick="$('#flipbook').turn('page', 1)">Primera</button>
    <button onclick="$('#flipbook').turn('previous')">⏪ Anterior</button>
    <button onclick="$('#flipbook').turn('next')">⏩ Siguiente</button>
    <button onclick="$('#flipbook').turn('page', $('#flipbook').turn('pages'))">Última</button>
  </div>

  <script>
    const totalPaginas = {
      dama: 384,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function calcularDimensiones() {
      const anchoVentana = window.innerWidth;
      const altoVentana = window.innerHeight;

      if (anchoVentana < 768) {
        return { width: anchoVentana * 0.9, height: altoVentana * 0.7, display: 'single' };
      } else {
        return { width: 800, height: 500, display: 'double' };
      }
    }

    function cargarCategoria(categoria) {
      const total = totalPaginas[categoria];
      const $flipbook = $('#flipbook');
      $flipbook.html('');

      for (let i = 1; i <= total; i++) {
        const padded = i.toString().padStart(4, '0');
        const url = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-${padded}.webp`;
        $flipbook.append(`<div class="page"><img src="${url}" alt="Página ${i}"></div>`);
      }

      // Si ya estaba inicializado, lo destruimos
      if ($flipbook.data('turn')) {
        $flipbook.turn('destroy').removeClass('turnjs');
      }

      const { width, height, display } = calcularDimensiones();

      // Aplicamos el estilo y activamos turn.js
      $flipbook.css({ width: `${width}px`, height: `${height}px` });

      $flipbook.turn({
        width: width,
        height: height,
        autoCenter: true,
        display: display,
        elevation: 50,
        gradients: true
      });
    }

    // Cargar por defecto
    $(document).ready(() => {
      cargarCategoria('dama');

      // Recargar en redimensionamiento (por si giran el móvil)
      window.addEventListener('resize', () => {
        cargarCategoria(categoriaActual);
      });
    });

    let categoriaActual = 'dama';
  </script>
</body>
</html>
