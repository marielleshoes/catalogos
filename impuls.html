<script>
  let pageFlip;
  let scale = 1;
  const minScale = 1;
  const maxScale = 3;
  const scaleStep = 0.1;

  function cargarCatalogo(categoria) {
    const catalogoDiv = document.getElementById('catalogo');
    catalogoDiv.innerHTML = '';

    let totalPaginas = 0;
    let ruta = '';
    let prefijo = '';

    switch (categoria) {
      case 'dama':
        totalPaginas = 384;
        ruta = 'pdfs/impuls_dama/';
        prefijo = 'MC_Impuls Dama_page-';
        break;
      case 'caballero':
        totalPaginas = 100;
        ruta = 'pdfs/impuls_caballero/';
        prefijo = 'MC_Impuls Caballero_page-';
        break;
      case 'niña':
        totalPaginas = 80;
        ruta = 'pdfs/impuls_niña/';
        prefijo = 'MC_Impuls Niña_page-';
        break;
      case 'niño':
        totalPaginas = 70;
        ruta = 'pdfs/impuls_niño/';
        prefijo = 'MC_Impuls Niño_page-';
        break;
      default:
        return;
    }

    const bookContainer = document.createElement('div');
    bookContainer.id = 'flipbook';
    catalogoDiv.appendChild(bookContainer);

    const navButtons = document.createElement('div');
    navButtons.className = 'navigation-buttons';
    navButtons.innerHTML = `
      <button onclick="pageFlip.flipPrev()">Anterior</button>
      <button onclick="pageFlip.flipNext()">Siguiente</button>
    `;
    catalogoDiv.appendChild(navButtons);

    pageFlip = new St.PageFlip(bookContainer, {
      width: 1199,
      height: 1583,
      size: 'stretch',
      minWidth: 600,
      maxWidth: 1400,
      minHeight: 800,
      maxHeight: 1800,
      showCover: false,
      mobileScrollSupport: true,
      useMouseEvents: true
    });

    const pages = [];
    for (let i = 1; i <= totalPaginas; i++) {
      const num = i.toString().padStart(4, '0');
      const imgPath = `${ruta}${prefijo}${num}.webp`;
      pages.push({ src: imgPath });
    }

    pageFlip.loadFromImages(pages.map(p => p.src)).then(() => {
      // Zoom con rueda del mouse
      bookContainer.addEventListener("wheel", (e) => {
        if (e.ctrlKey) {
          e.preventDefault();
          scale += (e.deltaY < 0 ? scaleStep : -scaleStep);
          scale = Math.min(maxScale, Math.max(minScale, scale));
          aplicarZoom();
        }
      });

      // Zoom con doble clic
      bookContainer.addEventListener("dblclick", () => {
        scale = scale === 1 ? 2 : 1;
        aplicarZoom();
      });

      // Zoom táctil (pinch-to-zoom)
      let pinchStartDist = 0;
      bookContainer.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
          pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      });

      bookContainer.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2) {
          const pinchCurrentDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const pinchDiff = pinchCurrentDist - pinchStartDist;
          scale += pinchDiff * 0.001;
          scale = Math.min(maxScale, Math.max(minScale, scale));
          aplicarZoom();
          pinchStartDist = pinchCurrentDist;
        }
      });
    });
  }

  function aplicarZoom() {
    const pages = document.querySelectorAll("#flipbook .page");
    pages.forEach(page => {
      page.style.transform = `scale(${scale})`;
      page.style.transformOrigin = "center center";
    });
  }
</script>
