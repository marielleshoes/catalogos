<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Catálogo Impuls</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .viewer-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 80vh;
      overflow: hidden;
    }

    .viewer {
      position: relative;
      display: flex;
      border: 2px solid #ccc;
      background: white;
      width: 95vw;
      height: 80vh;
      overflow: auto;
      margin: auto;
      touch-action: pan-x pan-y;
    }

    .image-container {
      display: flex;
      transform-origin: top left;
      transition: transform 0.2s ease;
    }

    .image-container img {
      max-width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      margin: 0 10px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    .loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .image-container {
        flex-direction: column;
        align-items: center;
      }

      .image-container img:nth-child(2) {
        display: none;
      }

      .viewer {
        height: auto;
      }
    }

    @media (min-width: 769px) {
      .image-container {
        justify-content: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>Catálogo Impuls primera y ultima</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div class="viewer-wrapper">
    <div id="viewer" class="viewer">
      <div id="loading" class="loading" style="display: none;">Cargando...</div>
      <div id="imageContainer" class="image-container">
        <img id="page1" src="" alt="Página izquierda">
        <img id="page2" src="" alt="Página derecha">
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="irAPrimeraImagen()">Primera</button>
    <button onclick="paginaAnterior()">⏪ Anterior</button>
    <button onclick="zoomIn()">🔍 Acercar</button>
    <button onclick="zoomOut()">🔍 Alejar</button>
    <button onclick="paginaSiguiente()">⏩ Siguiente</button>
    <button onclick="irAUltimaImagen()">Última</button>
  </div>

  <script>
    let categoria = 'dama';
    let pagina = 1;
    const totalPaginas = {
      dama: 384,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let zoom = 1;
    let zoomInicial = 1;

    function esMovil() {
      return window.innerWidth <= 768;
    }

    function mostrarCargando(mostrar) {
      document.getElementById('loading').style.display = mostrar ? 'flex' : 'none';
    }

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function actualizarImagenes() {
      const base = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-`;
      const img1 = document.getElementById('page1');
      const img2 = document.getElementById('page2');
      const container = document.getElementById('imageContainer');

      const maxPaginas = totalPaginas[categoria];

      const padded1 = pagina.toString().padStart(4, '0');
      const padded2 = (pagina + 1).toString().padStart(4, '0');

      mostrarCargando(true);
      let loadedCount = 0;
      const isMobile = esMovil();

      const checkLoaded = () => {
        loadedCount++;
        const expected = (!isMobile && img2.style.display !== 'none') ? 2 : 1;
        if (loadedCount === expected) {
          mostrarCargando(false);
        }
      };

      img1.onload = checkLoaded;
      img1.onerror = checkLoaded;
      img1.src = `${base}${padded1}.webp`;

      if (isMobile || pagina === 1 || pagina >= maxPaginas) {
        img2.style.display = 'none';
        img2.src = '';
      } else {
        img2.style.display = 'inline';
        img2.onload = checkLoaded;
        img2.onerror = checkLoaded;
        img2.src = `${base}${padded2}.webp`;
      }

      container.style.transform = `scale(${zoom})`;
      if (zoomInicial > zoom) {
        zoomInicial = zoom;
      }
    }

    function cargarCategoria(cat) {
      categoria = cat;
      pagina = 1;
      zoom = 1;
      document.getElementById('viewer').scrollLeft = 0;
      document.getElementById('viewer').scrollTop = 0;
      actualizarImagenes();
    }

    function paginaSiguiente() {
      const maxPaginas = totalPaginas[categoria];

      if (esMovil()) {
        if (pagina + 1 <= maxPaginas) {
          pagina += 1;
          actualizarImagenes();
        }
      } else {
        if (pagina === 1) {
          pagina += 1;
        } else if (pagina + 2 <= maxPaginas) {
          pagina += 2;
        } else if (pagina + 1 <= maxPaginas) {
          pagina += 1;
        }
        actualizarImagenes();
      }
    }

    function paginaAnterior() {
      if (esMovil()) {
        if (pagina - 1 >= 1) {
          pagina -= 1;
          actualizarImagenes();
        }
      } else {
        if (pagina <= 2) {
          pagina = 1;
        } else {
          pagina -= 2;
        }
        actualizarImagenes();
      }
    }

    function irAPrimeraImagen() {
      pagina = 1;
      actualizarImagenes();
    }

    function irAUltimaImagen() {
      const maxPaginas = totalPaginas[categoria];
      pagina = esMovil() ? maxPaginas : (maxPaginas % 2 === 0 ? maxPaginas - 1 : maxPaginas - 2);
      actualizarImagenes();
    }

    function zoomIn() {
      zoom += 0.1;
      actualizarImagenes();
    }

    function zoomOut() {
      if (zoom - 0.1 >= zoomInicial) {
        zoom -= 0.1;
        actualizarImagenes();
      } else {
        zoom = zoomInicial;
      }
    }

    let startX = 0;
    document.getElementById('viewer').addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
      }
    }, { passive: true });

    document.getElementById('viewer').addEventListener('touchend', function(e) {
      if (e.changedTouches.length === 1 && zoom === 1) {
        const endX = e.changedTouches[0].clientX;
        const deltaX = endX - startX;
        if (Math.abs(deltaX) > 50) {
          if (deltaX > 0) {
            paginaAnterior();
          } else {
            paginaSiguiente();
          }
        }
      }
    });
  </script>

</body>
</html>
