<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Impuls</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
.zoom-wrapper {
  width: 100vw;
  height: calc(100vh - 200px); /* Restamos espacio para botones y título */
  overflow: auto;
  background: white;
  border: 1px solid #ccc;
  display: flex;
  justify-content: center;
  align-items: center;
}

.viewer {
  display: flex;
  justify-content: center;
  align-items: center;
  transform-origin: center center;
  transition: transform 0.3s ease;
  width: fit-content;
}

.viewer img {
  max-height: 100%;
  max-width: 49vw;
  object-fit: contain;
  margin: 0 2px;
}

    .controls {
      margin-top: 15px;
      position: relative;
      z-index: 10;
    }

    .controls button {
      margin: 0 10px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Catálogo Impuls ya casi casi</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div class="zoom-wrapper" id="zoomWrapper">
    <div class="viewer" id="viewer">
      <img id="leftPage" src="" alt="Página izquierda">
      <img id="rightPage" src="" alt="Página derecha">
    </div>
  </div>

  <div class="controls">
    <button onclick="paginaAnterior()">⏪ Anterior</button>
    <button onclick="zoomIn()">🔍 Acercar</button>
    <button onclick="zoomOut()">🔍 Alejar</button>
    <button onclick="paginaSiguiente()">⏩ Siguiente</button>
  </div>

  <script>
    let categoria = 'dama';
    let pagina = 1;
    let zoom = 1;

    const totalPaginas = {
      dama: 384,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function actualizarImagenes() {
      const cat = capitalizar(categoria);
      const pag1 = pagina.toString().padStart(4, '0');
      const pag2 = (pagina + 1).toString().padStart(4, '0');

      const base = `pdfs/impuls_${categoria}/MC_Impuls%20${cat}_page-`;

      document.getElementById('leftPage').src = `${base}${pag1}.webp`;
      document.getElementById('rightPage').src = (pagina + 1 <= totalPaginas[categoria])
        ? `${base}${pag2}.webp`
        : '';

      document.getElementById('viewer').style.transform = `scale(${zoom})`;
    }

    function cargarCategoria(cat) {
      categoria = cat;
      pagina = 1;
      zoom = 1;
      actualizarImagenes();
    }

    function paginaSiguiente() {
      if (pagina + 2 <= totalPaginas[categoria]) {
        pagina += 2;
        actualizarImagenes();
      }
    }

    function paginaAnterior() {
      if (pagina - 2 >= 1) {
        pagina -= 2;
        actualizarImagenes();
      }
    }

    function zoomIn() {
      zoom += 0.2;
      actualizarImagenes();
    }

    function zoomOut() {
      if (zoom > 0.4) {
        zoom -= 0.2;
        actualizarImagenes();
      }
    }

    window.onload = () => {
      actualizarImagenes();
    };
  </script>

</body>
</html>
