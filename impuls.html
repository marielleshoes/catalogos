<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo Impuls</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      overflow: hidden;
    }

    .categorias {
      text-align: center;
      margin: 10px 0;
    }

    .categorias button {
      margin: 0 5px;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .viewer-container {
      width: 100vw;
      height: calc(100vh - 100px);
      overflow: hidden;
      position: relative;
    }

    #viewer {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .page {
      max-width: 45vw;
      max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
    }

    .controls {
      text-align: center;
      padding: 10px;
    }

    .controls button {
      margin: 5px;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="categorias">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
  </div>

  <div class="viewer-container">
    <div id="viewer"></div>
  </div>

  <div class="controls">
    <button onclick="paginaAnterior()">⏪ Anterior</button>
    <button onclick="paginaSiguiente()">Siguiente ⏩</button>
    <button onclick="zoomIn()">🔍+</button>
    <button onclick="zoomOut()">🔍−</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@9.4.0/dist/panzoom.min.js"></script>
  <script>
    const totalPaginasPorCategoria = {
      dama: 384,
      caballero: 100,
      niña: 60,
      niño: 80
    };

    let categoriaActual = 'dama';
    let paginaActual = 1;
    let panzoomInstance;
    let escala = 1;

    const viewer = document.getElementById('viewer');

    function cargarCategoria(categoria) {
      categoriaActual = categoria;
      paginaActual = 1;
      cargarPaginas();
    }

    function cargarPaginas() {
      viewer.innerHTML = '';

      const imagen1 = document.createElement('img');
      const imagen2 = document.createElement('img');
      imagen1.className = 'page';
      imagen2.className = 'page';

      const carpeta = `pdfs/impuls_${categoriaActual}`;
      const total = totalPaginasPorCategoria[categoriaActual];

      let pagina1 = paginaActual;
      let pagina2 = paginaActual + 1;

      if (pagina1 > total) pagina1 = total;
      if (pagina2 > total) pagina2 = total;

      imagen1.src = `${carpeta}/MC_Impuls ${capitalizar(categoriaActual)}_page-${pagina1.toString().padStart(4, '0')}.webp`;
      imagen2.src = `${carpeta}/MC_Impuls ${capitalizar(categoriaActual)}_page-${pagina2.toString().padStart(4, '0')}.webp`;

      viewer.appendChild(imagen1);
      viewer.appendChild(imagen2);

      if (panzoomInstance) panzoomInstance.destroy();
      panzoomInstance = Panzoom(viewer, {
        maxScale: 4,
        minScale: 1,
        contain: 'outside',
      });

      viewer.addEventListener('wheel', panzoomInstance.zoomWithWheel);
      escala = 1;
    }

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function paginaSiguiente() {
      const total = totalPaginasPorCategoria[categoriaActual];
      if (paginaActual + 2 <= total) {
        paginaActual += 2;
        cargarPaginas();
      }
    }

    function paginaAnterior() {
      if (paginaActual - 2 >= 1) {
        paginaActual -= 2;
        cargarPaginas();
      }
    }

    function zoomIn() {
      if (panzoomInstance) {
        escala = Math.min(4, escala + 0.1);
        panzoomInstance.zoomTo(0, 0, escala);
      }
    }

    function zoomOut() {
      if (panzoomInstance) {
        escala = Math.max(1, escala - 0.1);
        panzoomInstance.zoomTo(0, 0, escala);
      }
    }

    // Carga inicial
    cargarCategoria('dama');
  </script>
</body>
</html>
