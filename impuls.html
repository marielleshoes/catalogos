<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Impuls</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px;
    }

    .menu {
      margin-bottom: 10px;
    }

    .menu button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .viewer {
      width: 100vw;
      height: 80vh;
      overflow-x: auto;
      overflow-y: hidden;
      border-top: 2px solid #ccc;
      border-bottom: 2px solid #ccc;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-container {
      display: flex;
      flex-direction: row;
      gap: 10px;
      padding: 10px;
      transform-origin: left top;
      transition: transform 0.2s ease-in-out;
    }

    .image-container img {
      max-width: none;
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    .controls {
      margin: 20px 0;
    }

    .controls button {
      padding: 10px 15px;
      margin: 0 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Catálogo Impuls 3</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div class="viewer" id="viewer">
    <div class="image-container" id="imageContainer">
      <img id="page1" src="" alt="Página izquierda">
      <img id="page2" src="" alt="Página derecha">
    </div>
  </div>

  <div class="controls">
    <button onclick="paginaAnterior()">⏪ Anterior</button>
    <button onclick="zoomIn()">🔍 Acercar</button>
    <button onclick="zoomOut()">🔍 Alejar</button>
    <button onclick="paginaSiguiente()">⏩ Siguiente</button>
    <button onclick="resetZoom()">🔄 Reset</button>
  </div>

  <script>
    let categoria = 'dama';
    let pagina = 1;
    const totalPaginas = {
      dama: 20,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let zoom = 1;

    const viewer = document.getElementById('viewer');
    const imageContainer = document.getElementById('imageContainer');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function actualizarImagenes() {
      const padded1 = pagina.toString().padStart(4, '0');
      const padded2 = (pagina + 1).toString().padStart(4, '0');
      const base = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-`;

      page1.src = `${base}${padded1}.webp`;
      page2.src = `${base}${padded2}.webp`;
    }

    function cargarCategoria(cat) {
      categoria = cat;
      pagina = 1;
      zoom = 1;
      actualizarImagenes();
      aplicarZoom();
    }

    function paginaSiguiente() {
      if (pagina + 2 <= totalPaginas[categoria]) {
        pagina += 2;
        actualizarImagenes();
      }
    }

    function paginaAnterior() {
      if (pagina - 2 >= 1) {
        pagina -= 2;
        actualizarImagenes();
      }
    }

    function zoomIn() {
      zoom = Math.min(zoom + 0.1, 3);
      aplicarZoom();
    }

    function zoomOut() {
      zoom = Math.max(zoom - 0.1, 0.3);
      aplicarZoom();
    }

    function resetZoom() {
      zoom = 1;
      aplicarZoom();
    }

    function aplicarZoom() {
      imageContainer.style.transform = `scale(${zoom})`;
      viewer.scrollLeft = 0; // opcional: ir al inicio tras zoom
    }

    window.onload = () => {
      actualizarImagenes();
      aplicarZoom();
    };
  </script>

</body>
</html>
