<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Impuls</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
      flex-wrap: wrap;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .viewer-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

.viewer {
  display: flex;
  justify-content: center;
  align-items: center;
  border: 2px solid #ccc;
  background: white;
  max-width: 95vw;
  width: 100%;
  height: 80vh;
  overflow: auto; /* importante */
  flex-direction: column;
  position: relative;
}

.image-container {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: nowrap;
  gap: 10px;
  transform-origin: top left;
  width: max-content; /* asegura scroll horizontal */
}


    .image-container img {
      width: 48%;
      max-width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .controls button {
      margin: 5px 10px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }

    @media (max-width: 768px) {
      .image-container img {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>Catálogo Impuls celu mejora 1</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div class="viewer-wrapper">
    <div id="viewer" class="viewer">
      <div id="imageContainer" class="image-container">
        <img id="page1" src="" alt="Página izquierda" loading="lazy">
        <img id="page2" src="" alt="Página derecha" loading="lazy">
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="paginaAnterior()">⏪ Anterior</button>
    <button onclick="zoomIn()">🔍 Acercar</button>
    <button onclick="zoomOut()">🔍 Alejar</button>
    <button onclick="paginaSiguiente()">⏩ Siguiente</button>
  </div>

  <script>
    let categoria = 'dama';
    let pagina = 1;
    const totalPaginas = {
      dama: 20,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let zoom = 1;

    function actualizarImagenes() {
      const padded1 = pagina.toString().padStart(4, '0');
      const padded2 = (pagina + 1).toString().padStart(4, '0');

      const base = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-`;

      document.getElementById('page1').src = `${base}${padded1}.webp`;
      document.getElementById('page2').src = `${base}${padded2}.webp`;

      document.getElementById('imageContainer').style.transform = `scale(${zoom})`;
    }

    function cargarCategoria(cat) {
      categoria = cat;
      pagina = 1;
      zoom = 1;
      document.getElementById('viewer').scrollLeft = 0;
      document.getElementById('viewer').scrollTop = 0;
      actualizarImagenes();
    }

    function paginaSiguiente() {
      if (pagina + 2 <= totalPaginas[categoria]) {
        pagina += 2;
        actualizarImagenes();
      }
    }

    function paginaAnterior() {
      if (pagina - 2 >= 1) {
        pagina -= 2;
        actualizarImagenes();
      }
    }

function zoomIn() {
  zoom += 0.1;
  aplicarZoom();
}

function zoomOut() {
  if (zoom > 0.2) {
    zoom -= 0.1;
    aplicarZoom();
  }
}

function aplicarZoom() {
  document.getElementById('imageContainer').style.transform = `scale(${zoom})`;
  document.getElementById('viewer').scrollLeft = 0; // puedes ajustar esto si prefieres mantener posición
}


    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    window.onload = () => {
      actualizarImagenes();
    };
  </script>

</body>
</html>
