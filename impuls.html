<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Impuls</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .viewer-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh;
      overflow: hidden;
    }

    .viewer {
      display: flex;
      border: 2px solid #ccc;
      background: white;
      width: 95vw;
      height: 100%;
      overflow: auto;
      position: relative;
    }

    .image-container {
      display: flex;
      flex-direction: row;
      gap: 10px;
      padding: 10px;
    }

    .image-container img {
      height: auto;
      max-width: none;
      user-select: none;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      margin: 0 10px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Catálogo Impuls edit 3</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div class="viewer-wrapper">
    <div id="viewer" class="viewer">
      <div id="imageContainer" class="image-container">
        <img id="page1" src="" alt="Página izquierda">
        <img id="page2" src="" alt="Página derecha">
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="paginaAnterior()">⏪ Anterior</button>
    <button onclick="zoomIn()">🔍 Acercar</button>
    <button onclick="zoomOut()">🔍 Alejar</button>
    <button onclick="paginaSiguiente()">⏩ Siguiente</button>
    <button onclick="resetZoom()">🔄 Reset</button>
  </div>

  <script>
    let categoria = 'dama';
    let pagina = 1;
    const totalPaginas = {
      dama: 20,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let zoom = 1;

    function actualizarImagenes() {
      const padded1 = pagina.toString().padStart(4, '0');
      const padded2 = (pagina + 1).toString().padStart(4, '0');
      const base = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-`;

      document.getElementById('page1').src = `${base}${padded1}.webp`;
      document.getElementById('page2').src = `${base}${padded2}.webp`;

      aplicarZoom();
    }

    function cargarCategoria(cat) {
      categoria = cat;
      pagina = 1;
      zoom = 1;
      actualizarImagenes();
    }

    function paginaSiguiente() {
      if (pagina + 2 <= totalPaginas[categoria]) {
        pagina += 2;
        actualizarImagenes();
      }
    }

    function paginaAnterior() {
      if (pagina - 2 >= 1) {
        pagina -= 2;
        actualizarImagenes();
      }
    }

    function zoomIn() {
      zoom = Math.min(zoom + 0.1, 3); // máximo 3x
      aplicarZoom();
    }

    function zoomOut() {
      zoom = Math.max(zoom - 0.1, 0.3); // mínimo 0.3x
      aplicarZoom();
    }

    function resetZoom() {
      zoom = 1;
      aplicarZoom();
    }

    function aplicarZoom() {
      const page1 = document.getElementById('page1');
      const page2 = document.getElementById('page2');
      const viewer = document.getElementById('viewer');

      const oldScrollLeft = viewer.scrollLeft;
      const oldWidth = page1.offsetWidth + page2.offsetWidth;

      // Aplicar nuevo zoom
      page1.style.width = `${zoom * 100}%`;
      page2.style.width = `${zoom * 100}%`;

      // Ajustar scroll para mantener centrado
      setTimeout(() => {
        const newWidth = page1.offsetWidth + page2.offsetWidth;
        const newScrollLeft = (viewer.scrollLeft / oldWidth) * newWidth;
        viewer.scrollLeft = newScrollLeft;
      }, 0);
    }

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    window.onload = () => {
      actualizarImagenes();
    };
  </script>

</body>
</html>
