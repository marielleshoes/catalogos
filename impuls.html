<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Catálogo Impuls</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .menu {
      margin: 20px;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #flipbook {
      width: 90%;
      height: 80vh;
      margin: auto;
    }

    .page {
      width: 100%;
      height: 100%;
      background-color: white;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      touch-action: pinch-zoom;
      transition: transform 0.3s ease;
    }

    .zoomed {
      transform: scale(2);
      transform-origin: center;
      cursor: zoom-out;
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      margin: 0 10px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      #flipbook {
        width: 100%;
        height: auto;
      }

      .page {
        height: 60vh;
      }
    }
  </style>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Turn.js v3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
</head>
<body>

  <h1>Catálogo Impuls turns funcion</h1>

  <div class="menu">
    <button onclick="cargarCategoria('dama')">Dama</button>
    <button onclick="cargarCategoria('caballero')">Caballero</button>
    <button onclick="cargarCategoria('niño')">Niño</button>
    <button onclick="cargarCategoria('niña')">Niña</button>
  </div>

  <div id="flipbook"></div>

  <div class="controls">
    <button onclick="$('#flipbook').turn('page', 1)">Primera</button>
    <button onclick="$('#flipbook').turn('previous')">⏪ Anterior</button>
    <button onclick="$('#flipbook').turn('next')">⏩ Siguiente</button>
    <button onclick="$('#flipbook').turn('page', $('#flipbook').turn('pages'))">Última</button>
  </div>

  <script>
    const totalPaginas = {
      dama: 384,
      caballero: 15,
      niño: 10,
      niña: 12
    };

    let categoriaActual = 'dama';

    function cargarCategoria(categoria) {
      categoriaActual = categoria;
      const total = totalPaginas[categoria];
      const $flipbook = $('#flipbook');
      $flipbook.html('');

      for (let i = 1; i <= total; i++) {
        const padded = i.toString().padStart(4, '0');
        const base = `pdfs/impuls_${categoria}/MC_Impuls%20${capitalizar(categoria)}_page-${padded}.webp`;
        const page = $('<div class="page"></div>').css('background-image', `url(${base})`);
        $flipbook.append(page);
      }

      if ($flipbook.data('turn')) {
        $flipbook.turn('destroy');
      }

      setTimeout(() => {
        $flipbook.turn({
          width: $flipbook.width(),
          height: window.innerWidth < 768 ? window.innerHeight * 0.6 : $flipbook.height(),
          autoCenter: true
        });
      }, 100);
    }

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    // Zoom al hacer doble clic
    $(document).on('dblclick', '.page', function () {
      $(this).toggleClass('zoomed');
    });

    $(document).ready(function () {
      cargarCategoria('dama');
    });

    $(window).on('resize', function () {
      const $flipbook = $('#flipbook');
      if ($flipbook.data('turn')) {
        $flipbook.turn('size', $flipbook.width(), window.innerWidth < 768 ? window.innerHeight * 0.6 : $flipbook.height());
      }
    });
  </script>

</body>
</html>
