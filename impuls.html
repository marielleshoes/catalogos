<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Impuls</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #333;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header select {
      padding: 8px;
      font-size: 16px;
    }

    .zoom-wrapper {
      width: 100vw;
      height: calc(100vh - 60px);
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .viewer {
      display: flex;
      flex-wrap: nowrap;
      transform-origin: center center;
      transition: transform 0.3s ease;
    }

    .page-pair {
      display: flex;
      flex-direction: row;
    }

    .page-pair img {
      height: 100%;
      width: auto;
      max-height: 3166px;
      max-width: 50vw;
      object-fit: contain;
    }

    .controls {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 1000;
    }

    .controls button {
      margin: 0 5px;
      padding: 10px 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<header>
  <h2>Catálogo Impuls creo que ya casi</h2>
  <div>
    <label for="categoria">Categoría: </label>
    <select id="categoria" onchange="cambiarCategoria(this.value)">
      <option value="dama">Dama</option>
      <option value="caballero">Caballero</option>
      <option value="nina">Niña</option>
      <option value="nino">Niño</option>
    </select>
  </div>
</header>

<div class="zoom-wrapper">
  <div class="viewer" id="viewer"></div>
</div>

<div class="controls">
  <button onclick="zoomOut()">Zoom -</button>
  <button onclick="zoomIn()">Zoom +</button>
</div>

<script>
  const totalPaginasPorCategoria = {
    dama: 384,
    caballero: 122,
    nina: 118,
    nino: 100
  };

  const viewer = document.getElementById("viewer");
  let scale = 1;
  let categoriaActual = 'dama';

  function pad(num) {
    return num.toString().padStart(4, '0');
  }

  function limpiarViewer() {
    viewer.innerHTML = "";
  }

  function cargarPaginas(categoria) {
    const carpeta = `pdfs/impuls_${categoria}`;
    const prefijo = `MC_Impuls ${capitalizar(categoria)}_page-`;
    const total = totalPaginasPorCategoria[categoria];

    for (let i = 1; i <= total; i += 2) {
      const contenedor = document.createElement("div");
      contenedor.className = "page-pair";

      const img1 = document.createElement("img");
      img1.src = `${carpeta}/${prefijo}${pad(i)}.webp`;
      img1.alt = `Página ${i}`;
      contenedor.appendChild(img1);

      if (i + 1 <= total) {
        const img2 = document.createElement("img");
        img2.src = `${carpeta}/${prefijo}${pad(i + 1)}.webp`;
        img2.alt = `Página ${i + 1}`;
        contenedor.appendChild(img2);
      }

      viewer.appendChild(contenedor);
    }
  }

  function ajustarEscalaInicial() {
    const availableHeight = window.innerHeight - 60;
    const originalPageHeight = 3166;
    scale = availableHeight / originalPageHeight;
    viewer.style.transform = `scale(${scale})`;
  }

  function zoomIn() {
    scale += 0.1;
    viewer.style.transform = `scale(${scale})`;
  }

  function zoomOut() {
    scale = Math.max(0.1, scale - 0.1);
    viewer.style.transform = `scale(${scale})`;
  }

  function cambiarCategoria(categoria) {
    categoriaActual = categoria;
    limpiarViewer();
    cargarPaginas(categoriaActual);
    ajustarEscalaInicial();
  }

  function capitalizar(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  window.addEventListener("load", () => {
    cargarPaginas(categoriaActual);
    ajustarEscalaInicial();
  });

  window.addEventListener("resize", ajustarEscalaInicial);
</script>

</body>
</html>
