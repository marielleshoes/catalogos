<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Catálogo</title>
    <link rel="stylesheet" href="css/estilmars.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  </head>
  <body>
    <div class="fondo-blur">
      <header>
        <h1 id="titulo">Catálogo</h1>
      </header>
      
      <div style="text-align: center; margin: 10px;">
        <a href="index.html" class="btn-volver">← Volver al inicio</a>
      </div>
  
      <div class="menu" id="menuCategorias"></div>
      <div id="viewerContainer"></div>
    </div>
    
    <a class="whatsapp-btn" href="https://wa.me/5211234567890" target="_blank" aria-label="Chatea por WhatsApp">
      <i class="fab fa-whatsapp"></i>
    </a>
    
    <script>
      let datosMarca = {};
      let marca = getQueryParam('mc') || 'impuls'; // puede venir de query param o ruta en el futuro
      let categoria = '';
      let pagina = 1;
      let zoom = 1;
      let zoomInicial = 1;
  
      function esMovil() {
        return window.innerWidth <= 768;
      }
  
      function mostrarCargando(mostrar) {
        document.getElementById('loading').style.display = mostrar ? 'flex' : 'none';
      }

      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }
      
      function capitalizar(texto) {
        return texto.charAt(0).toUpperCase() + texto.slice(1);
      }
  
      async function cargarDatosMarca() {
        const res = await fetch('marcas.json');
        const data = await res.json();
        datosMarca = data[marca];
        document.getElementById('titulo').textContent = datosMarca.h1;
        generarMenu();
        categoria = datosMarca.categoriaInicial;
        cargarCategoria(categoria);
      }
  
      function generarMenu() {
        const menu = document.getElementById('menuCategorias');
        menu.innerHTML = '';
        datosMarca.menu.forEach(cat => {
          const btn = document.createElement('button');
          btn.textContent = capitalizar(cat);
          btn.onclick = () => cargarCategoria(cat);
          menu.appendChild(btn);
        });
      }
  
      function actualizarImagenes() {
        const catData = datosMarca.categorias[categoria];
        const maxPaginas = catData.totalPaginas;
        const base = catData.baseImagen;
        const img1 = document.getElementById('page1');
        const img2 = document.getElementById('page2');
        const container = document.getElementById('imageContainer');
        const padded1 = pagina.toString().padStart(4, '0');
        const padded2 = (pagina + 1).toString().padStart(4, '0');
        mostrarCargando(true);
        let loaded = 0;
        const isMobile = esMovil();
        const checkLoaded = () => {
          loaded++;
          const esperado = (!isMobile && img2.style.display !== 'none') ? 2 : 1;
          if (loaded >= esperado) mostrarCargando(false);
        };
        img1.onload = checkLoaded;
        img1.onerror = checkLoaded;
        img1.src = `${base}${padded1}.webp`;
        if (isMobile || pagina === 1 || pagina >= maxPaginas) {
          img2.style.display = 'none';
          img2.src = '';
        } else {
          img2.style.display = 'inline';
          img2.onload = checkLoaded;
          img2.onerror = checkLoaded;
          img2.src = `${base}${padded2}.webp`;
        }
        container.style.transform = `scale(${zoom})`;
        if (zoom < zoomInicial) zoomInicial = zoom;
      }
  
      function cargarCategoria(cat) {
        categoria = cat;
        pagina = 1;
        zoom = 1;
        const viewerContainer = document.getElementById('viewerContainer');
        viewerContainer.innerHTML = '';
        const botones = document.querySelectorAll('.menu button');
        botones.forEach(b => b.classList.remove('selected'));
        const activo = [...botones].find(b => b.textContent.toLowerCase() === cat);
        if (activo) activo.classList.add('selected');   
        if (marca === 'andrea' || marca === 'shoespakar' || marca === 'fuller' || marca === 'tupperware' || marca === 'ilusion') {
          const catData = datosMarca.categorias[cat];
          const url = catData.viewerUrl || catData.pdf;
          viewerContainer.innerHTML = `
            <iframe 
              src="${url}" 
              width="80%" 
              height="700" 
              frameborder="0" 
              allowfullscreen 
              style="border:none; display:block; margin: 0 auto 60px;">
            </iframe>
          `;
        } else {
          document.getElementById('viewerContainer').innerHTML = `
            <div class="controls">
              <button onclick="descargarPDF()">⬇️ Descargar PDF</button>
            </div>
            <div class="viewer-wrapper">
              <div id="loading" class="loading" style="display: none;">Cargando...</div>
              <div id="viewer" class="viewer">
                <div id="imageContainer" class="image-container">
                  <img id="page1" src="" alt="Página izquierda">
                  <img id="page2" src="" alt="Página derecha">
                </div>
              </div>
            </div>
            <div class="controls">
              <button onclick="irAPrimeraImagen()">⏮ Primera</button>
              <button onclick="paginaAnterior()">⬅️ Anterior</button>
              <button onclick="zoomIn()">🔎 Acercar</button>
              <button onclick="zoomOut()">🔍 Alejar</button>
              <button onclick="paginaSiguiente()">➡️ Siguiente</button>
              <button onclick="irAUltimaImagen()">⏭ Última</button>
            </div>
          `;
          document.getElementById('viewer').scrollLeft = 0;
          document.getElementById('viewer').scrollTop = 0;
          actualizarImagenes();
           if (marca !== 'andrea') {
            // Espera a que exista #viewer para agregar los eventListeners
            const viewer = document.getElementById('viewer');
          
            viewer.addEventListener('touchstart', e => {
              if (e.touches.length === 1) {
                startX = e.touches[0].clientX;
              }
            }, { passive: true });
          
            viewer.addEventListener('touchend', e => {
              if (e.changedTouches.length === 1 && zoom === 1) {
                const deltaX = e.changedTouches[0].clientX - startX;
                if (Math.abs(deltaX) > 50) {
                  if (deltaX > 0) paginaAnterior();
                  else paginaSiguiente();
                }
              }
            });
          
            viewer.addEventListener('touchstart', e => {
              if (e.touches.length === 2) {
                initialDistance = getDistance(e.touches);
                lastZoom = zoom;
              }
            }, { passive: true });
          
            viewer.addEventListener('touchmove', e => {
              if (e.touches.length === 2 && initialDistance !== null) {
                const currentDistance = getDistance(e.touches);
                const scale = currentDistance / initialDistance;
                zoom = Math.min(3, Math.max(zoomInicial, lastZoom * scale));
                actualizarImagenes();
                e.preventDefault();
              }
            }, { passive: false });
          
            viewer.addEventListener('touchend', e => {
              if (e.touches.length < 2) initialDistance = null;
            });
          }
        }
      }
  
      function paginaSiguiente() {
        const maxPag = datosMarca.categorias[categoria].totalPaginas;
        if (esMovil()) {
          if (pagina + 1 <= maxPag) pagina++;
        } else {
          if (pagina === 1) {
            pagina++;
          } else if (pagina + 2 <= maxPag) {
            pagina += 2;
          } else if (pagina + 1 <= maxPag) {
            pagina += 1;
          }
        }
        actualizarImagenes();
      }
  
      function paginaAnterior() {
        if (esMovil()) {
          if (pagina - 1 >= 1) pagina--;
        } else {
          if (pagina <= 2) {
            pagina = 1;
          } else {
            pagina -= 2;
          }
        }
        actualizarImagenes();
      }
  
      function irAPrimeraImagen() {
        pagina = 1;
        actualizarImagenes();
      }
  
      function irAUltimaImagen() {
        const maxPag = datosMarca.categorias[categoria].totalPaginas;
        pagina = esMovil() ? maxPag : (maxPag % 2 === 0 ? maxPag - 1 : maxPag - 2);
        actualizarImagenes();
      }
  
      function zoomIn() {
        zoom += 0.1;
        actualizarImagenes();
      }
  
      function zoomOut() {
        zoom = Math.max(zoomInicial, zoom - 0.1);
        actualizarImagenes();
      }
  
      function descargarPDF() {
        const pdf = datosMarca.categorias[categoria].pdf;
        const enlace = document.createElement('a');
        enlace.href = pdf;
        enlace.download = pdf.split('/').pop();
        enlace.click();
      }
  
      // Gestos táctiles
      let startX = 0;
  
      // Pinch Zoom
      let initialDistance = null;
      let lastZoom = zoom;

      function getDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      //window.onload = cargarDatosMarca;
      window.onresize = actualizarImagenes;
      window.onload = () => {
          cargarDatosMarca();
        }
    </script>
  </body>
</html>
